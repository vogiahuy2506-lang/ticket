services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tickets}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Hard-coded on purpose: inside the compose network the database is
      # reached by service name, never by the host port. Do NOT reuse
      # ${DATABASE_URL} here - that variable is meant for processes running
      # on the host (npm run dev / npm run e2e).
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}
      # The container always listens on 3001 internally; API_PORT publishes it
      # on the host. A host-run API uses PORT from .env instead.
      PORT: 3001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3101}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      MOCK_GATEWAY: ${MOCK_GATEWAY:-true}
      MOCK_GATEWAY_SECRET: ${MOCK_GATEWAY_SECRET:-mock-secret-local-dev}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpay.vn}
      VNPAY_MERCHANT_CODE: ${VNPAY_MERCHANT_CODE:-}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # The container always listens on 3001; API_PORT is the host port it
      # is published on, and the same port a host-run API would use.
      - "${API_PORT:-3101}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Hard-coded on purpose: inside the compose network the storefront
      # reaches the API by service name, never by the host port.
      API_BASE_URL: http://api:3001
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Optional public tunnel so the payment gateway can reach the IPN endpoint.
  # Start with:  docker compose --profile tunnel up --build
  # The printed https://<random>.trycloudflare.com URL must be copied into
  # PUBLIC_BASE_URL in .env and the stack restarted.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://api:3001
    depends_on:
      - api

volumes:
  db-data:
