name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, unit tests and end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tickets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tickets
      MOCK_GATEWAY: 'true'
      MOCK_GATEWAY_SECRET: mock-secret-local-dev
      LOG_LEVEL: error
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the shared package
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        # The integration tests create a private schema per test file and
        # drop it afterwards, so they need a reachable database. CI must
        # fail loudly if there is none - a silently skipped suite is
        # worse than a red build.
        run: npm test

      - name: End-to-end money flow
        # The run keeps its private schema and writes its name to a file,
        # so that the balance check below can audit the very journal the
        # money flow wrote instead of an empty database.
        env:
          E2E_KEEP_SCHEMA: '1'
          E2E_SCHEMA_FILE: ${{ runner.temp }}/e2e-schema.txt
        run: npm run e2e

      - name: Build
        run: npm run build

      - name: Check the journal is balanced after the whole run
        # A script file, not an inline `tsx -e`: the snippet form is
        # evaluated as CommonJS, where a top-level `await` is a syntax
        # error, so the check never actually ran.
        env:
          AUDIT_SCHEMA_FILE: ${{ runner.temp }}/e2e-schema.txt
        run: npx tsx apps/api/scripts/audit-ledger.ts

      - name: Drop the private schema the e2e run kept
        # The schema was kept so that the balance check above could audit
        # the journal the money flow wrote. Now it is not needed any more.
        if: always()
        run: npx tsx apps/api/scripts/drop-schema.ts --file "${{ runner.temp }}/e2e-schema.txt"
